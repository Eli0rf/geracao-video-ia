name: CI

on:
  push:
    branches: [ main, develop, "feature/**", "fix/**", "docs/**" ]
  pull_request:
    branches: [ main, develop ]

# Cancela runs anteriores do mesmo branch/PR ao fazer novo push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Lint e Typecheck ──────────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Typecheck with mypy
        run: mypy src/ --ignore-missing-imports

  # ── Stage 2: Testes (depende de quality) ──────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create data directory
        run: mkdir -p data

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./data/test_ci.db

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v \
            --cov=src \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage.xml
          retention-days: 7
